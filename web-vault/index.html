<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vault · Raw Aroma Chem</title>
  <!-- §109.4 still holds where it matters: NO service worker (vault.js unregisters any stray one),
       nothing cached, nothing offline, no formula or session data in any storage. Owner requirement
       2026-09-29 ("all consoles open full screen, like a focus mode") adds ONLY a web app manifest so
       the Vault can open in its own app window: a manifest is a static description (name, icons,
       display mode) and makes the browser store no page data. Chromium installs without a service
       worker; Safari/iOS never needed one. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#26262B">
  <!-- UX-D: the one icon set every ALEMBIC and RawProd surface uses. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <!-- Outfit/JetBrains Mono vendored, not fetched from fonts.googleapis.com/fonts.gstatic.com --
       same reasoning web/ui-contract/fonts/outfit.css already documents for the factory console
       (two third-party origins in the boot path of a console that handles credentials, every
       visitor's IP disclosed to Google) and, here, the reason a same-origin `connect-src 'self'`
       CSP is enough with no font-origin allowance at all. -->
  <link rel="stylesheet" href="/fonts/outfit.css">
  <link rel="stylesheet" href="/fonts/jetbrains-mono.css">
  <link rel="stylesheet" href="/rac-console.css">
  <link rel="stylesheet" href="/alembic-tokens.css">
  <link rel="stylesheet" href="/vault.css">
  <link rel="stylesheet" href="/logo/brand.css">
  <!-- UX-E: the Ask Aria panel's styles; its script is fetched the first time Aria opens. -->
  <link rel="stylesheet" href="/aria-panel.css">
</head>
<body>
  <!-- UX-D: the RAW welcome (ALEMBIC's public/rac-preload.js, byte-identical), first in <body>. -->
  <script src="/rac-preload.js" data-mount="#root" data-logo="/logo/raw-logo@3x.png" data-fonts="/fonts/"></script>
  <div class="stage" id="root"></div>
  <!-- UX-F: click/notification/alert sounds (window.RaSound); before the console script, which calls it. -->
  <script src="/sound.js"></script>
  <!-- Focus mode + "open as an app" (owner 2026-09-29): full screen on the first click, a menu switch,
       and an install offer. Before the console script, which mounts the menu switch. -->
  <script src="/focus.js" data-app="RAW Vault"></script>
  <!-- Quick-access dock model (web/dock.js, same copy in every console): before the console script. -->
  <script src="/dock.js"></script>
  <script src="/vault.js"></script>
</body>
</html>
