# DEMO-INFRA (2026-09-24): API Gateway origin for the ALEMBIC OS DEMO environment. ENABLED on the app box.
#   https://<alembic-demo api>.execute-api...  --TLS:8444--> ALEMBIC demo, ALL surfaces on one host, routed by PATH
#   https://<factory-demo api>.execute-api...  --TLS:8445--> RawProd demo factory console + demo API
# Production ALEMBIC nginx is host-based (raw / rawadmin / rawagent). execute-api gives one hostname, so the demo
# serves store at /, Admin at /admin, Agent at /agent and the API at /api/ from the same host. The Next app already
# routes those surfaces by path; prod only splits them by host to 404 /admin and /agent on the storefront host.
# Gates (both required): SG rawaroma-demo-apigw-origin (8444-8445 from API_GATEWAY us-west-2 ranges only) and
# X-Origin-Verify == SSM /rawaroma/demo/origin-secret (rendered to /etc/nginx/rawaroma-demo/origin-secret.conf, 640,
# never in git; a DIFFERENT secret from prod's /rawaroma/rawprod/cf-origin-secret). X-Demo-Site pins each API to its port.
# TLS reuses the raw.huecycle.in LE cert (API Gateway needs a publicly trusted origin cert); certbot renew covers it.
# The upstream is on demo ports only (4010/3010/4110); nothing here can reach a production process.

upstream alembic_demo_api { server 127.0.0.1:4010; keepalive 8; }
upstream alembic_demo_web { server 127.0.0.1:3010; keepalive 8; }
upstream rawprod_demo_api { server 127.0.0.1:4110; keepalive 8; }
map $http_upgrade $demo_connection { default upgrade; '' ''; }

server {
  listen 8444 ssl http2;
  server_name _;
  ssl_certificate     /etc/letsencrypt/live/raw.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/raw.huecycle.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/rawaroma-demo/origin-secret.conf;   # set $demo_origin_secret "<value>";
  set $demo_ok "$http_x_demo_site:$http_x_origin_verify";
  if ($demo_ok != "alembic:$demo_origin_secret") { return 403; }
  access_log /var/log/nginx/alembic-demo-access.log;
  error_log  /var/log/nginx/alembic-demo-error.log;
  client_max_body_size 12m;
  include /etc/nginx/alembic/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Host              $http_x_demo_host;   # the execute-api hostname the viewer used
  proxy_set_header X-Forwarded-Host  $http_x_demo_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Origin-Verify   "";
  proxy_set_header X-Demo-Site       "";
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $demo_connection;
  proxy_read_timeout 120s;

  location = /healthz { default_type text/plain; add_header Cache-Control "no-store" always; return 200 "ok alembic-demo-origin\n"; }
  location /api/v1/payments/webhooks/ { proxy_pass http://alembic_demo_api; proxy_buffering off; }
  location /api/v1/webhooks/          { proxy_pass http://alembic_demo_api; proxy_buffering off; }
  location /api/ {
    proxy_pass http://alembic_demo_api;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/alembic/security-headers.conf;
  }
  location /admin { proxy_pass http://alembic_demo_web; include /etc/nginx/alembic/security-headers-console.conf; }
  location /agent { proxy_pass http://alembic_demo_web; include /etc/nginx/alembic/security-headers-console.conf; }
  location /_next/static/ {
    proxy_pass http://alembic_demo_web;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/alembic/security-headers.conf;
  }
  location / { proxy_pass http://alembic_demo_web; }
}

server {
  listen 8445 ssl http2;
  server_name _;
  ssl_certificate     /etc/letsencrypt/live/raw.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/raw.huecycle.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/rawaroma-demo/origin-secret.conf;
  set $demo_ok "$http_x_demo_site:$http_x_origin_verify";
  if ($demo_ok != "factory:$demo_origin_secret") { return 403; }
  access_log /var/log/nginx/rawprod-demo-access.log;
  error_log  /var/log/nginx/rawprod-demo-error.log;
  client_max_body_size 12m;
  include /etc/nginx/rawprod/security-headers-factory.conf;

  location = /healthz { default_type text/plain; add_header Cache-Control "no-store" always; include /etc/nginx/rawprod/security-headers-factory.conf; return 200 "ok rawprod-demo-origin\n"; }
  location ~ ^/(rpc|crypto/|v1/|auth/|health$) {
    proxy_pass http://rawprod_demo_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_x_demo_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Origin-Verify   "";
    proxy_set_header X-Demo-Site       "";
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $demo_connection;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }
  # static factory console, copied from /srv/rawprod-demo/app/web by install-box.sh (re-run after each demo deploy)
  root /var/www/rawprod-demo-cf/factory;
  location ~ /\. { return 404; }
  location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/rawprod/security-headers-factory.conf; try_files /sw.js =404; }
  # console-config.js (recorded from live 2026-09-25, lane cfg-rp): the same injection rawprod-cf-origin.conf does for
  # prod, pointing at the DEMO copy (/var/www/rawprod-config/demo, repo infra/aws/nginx/static-config/demo/).
  location = /console-config.js { root /var/www/rawprod-config/demo; try_files /console-config.js =404; }
  location / {
    sub_filter '<script src="/shell.js">' '<script src="/console-config.js"></script><script src="/shell.js">';
    sub_filter '<script src="/platform.js">' '<script src="/console-config.js"></script><script src="/platform.js">';
    sub_filter_once off;
    try_files $uri $uri/ $uri/index.html =404;
  }
}
