# rawvault.huecycle.in — public Formula Vault console (owner decision 2026-09-24).
# Terminates TLS on the app box; API proxied PRIVATELY to the Vault box (172.31.51.157:4100, SG-restricted).
# App-level guard: ALEMBIC SSO assertion + fresh email code + formulator/vault_approver role.
# Static root = web-vault from RawProd acc69f0.
# Recorded from live 2026-09-25 (OPS_GREEN §17): /etc/nginx/sites-available/rawvault.conf, enabled as
# sites-enabled/zz-rawvault.conf. Loads after rawprod-cf-origin.conf and REUSES its `upstream
# rawprod_api_cf` (the /main/ channel below). vault-config.js: infra/aws/nginx/static-config/vault/.
limit_req_zone $binary_remote_addr zone=rawvault_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rawvault_api:10m  rate=10r/s;
limit_req_status 429;
upstream rawvault_api_private { server 172.31.51.157:4100; keepalive 8; }

server {
  listen 80; listen [::]:80;
  server_name rawvault.huecycle.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl; listen [::]:443 ssl;
  server_name rawvault.huecycle.in;
  ssl_certificate     /etc/letsencrypt/live/rawlanes.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rawlanes.huecycle.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  include /etc/nginx/rawprod/security-headers-vault.conf;
  client_max_body_size 12m;
  access_log /var/log/nginx/rawvault-access.log;
  error_log  /var/log/nginx/rawvault-error.log;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection        "";
  proxy_read_timeout 120s;
  proxy_cache off;

  # sign-in / assertion / email-code paths: tight per-IP limit
  location /auth/ {
    limit_req zone=rawvault_auth burst=5 nodelay;
    proxy_pass http://rawvault_api_private;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location ~ ^/(rpc|crypto/|v1/) {
    limit_req zone=rawvault_api burst=40 nodelay;
    proxy_pass http://rawvault_api_private;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  # MAIN_API channel (vault.js window.MAIN_API='/main'): sign-in (/auth/alembic-assertion, /me) goes
  # to the MAIN RawProd API on this box, prefix stripped.
  location /main/ {
    limit_req zone=rawvault_auth burst=10 nodelay;
    proxy_pass http://rawprod_api_cf/;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location = /vault-config.js { include /etc/nginx/rawprod/security-headers-vault.conf; try_files /vault-config.js =404; }
  location = /health {
    proxy_pass http://rawvault_api_private;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }

  root /var/www/rawprod-cf/vault;
  location ~ /\. { return 404; }
  location / {
    sub_filter '<script src="/vault.js"></script>' '<script src="/vault-config.js"></script><script src="/vault.js"></script>';
    sub_filter_once on;
    try_files $uri $uri/ $uri/index.html =404; }
}
