# rawdemovault.huecycle.in — DEMO Formula Vault console. Modelled exactly on rawvault.conf (prod).
# API proxied PRIVATELY to the Vault box DEMO vault-api (172.31.51.157:4111); /main/ -> DEMO RawProd API (4110,
# upstream rawprod_demo_api from rawaroma-demo-origin.conf). Nothing here reaches a production process.
# Static root = /var/www/rawprod-demo-cf/vault (copy of /srv/rawprod-demo/app/web-vault).
# Recorded from live 2026-09-25 (lane cfg-rp): /etc/nginx/sites-available/rawdemovault.conf, enabled as
# sites-enabled/zz-rawdemovault.conf. Loads after rawaroma-demo-origin.conf (REUSES its `upstream rawprod_demo_api`
# for /main/) and before zz-rawvault.conf, whose http-level `limit_req_status 429;` applies here too (declaring it
# twice at http level is a duplicate-directive error). vault-config.js: infra/aws/nginx/static-config/demo-vault/.
limit_req_zone $binary_remote_addr zone=rawdemovault_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rawdemovault_api:10m  rate=10r/s;
upstream rawdemovault_api_private { server 172.31.51.157:4111; keepalive 8; }

server {
  listen 80; listen [::]:80;
  server_name rawdemovault.huecycle.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl; listen [::]:443 ssl;
  server_name rawdemovault.huecycle.in;
  ssl_certificate     /etc/letsencrypt/live/rawlanes.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rawlanes.huecycle.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  include /etc/nginx/rawprod/security-headers-vault.conf;
  client_max_body_size 12m;
  access_log /var/log/nginx/rawdemovault-access.log;
  error_log  /var/log/nginx/rawdemovault-error.log;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection        "";
  proxy_read_timeout 120s;
  proxy_cache off;

  location /auth/ {
    limit_req zone=rawdemovault_auth burst=5 nodelay;
    proxy_pass http://rawdemovault_api_private;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location ~ ^/(rpc|crypto/|v1/) {
    limit_req zone=rawdemovault_api burst=40 nodelay;
    proxy_pass http://rawdemovault_api_private;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location /main/ {
    limit_req zone=rawdemovault_auth burst=10 nodelay;
    proxy_pass http://rawprod_demo_api/;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location = /vault-config.js { include /etc/nginx/rawprod/security-headers-vault.conf; try_files /vault-config.js =404; }
  location = /health {
    proxy_pass http://rawdemovault_api_private;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }

  root /var/www/rawprod-demo-cf/vault;
  location ~ /\. { return 404; }
  location / {
    sub_filter '<script src="/vault.js"></script>' '<script src="/vault-config.js"></script><script src="/vault.js"></script>';
    sub_filter_once on;
    try_files $uri $uri/ $uri/index.html =404; }
}
