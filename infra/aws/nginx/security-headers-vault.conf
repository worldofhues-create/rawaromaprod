# Translated EXACTLY from web-vault/vercel.json's "headers" block — every key and every value,
# unchanged. This is the console that renders sealed formula data; Cache-Control: no-store is
# first for that reason, not stylistic. Same inheritance caveat as the other two
# security-headers-*.conf files — include at server level AND in any location with its own
# add_header.
add_header Cache-Control "no-store, private" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(), interest-cohort=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# S3 security review item 7: Vercel's platform added this automatically; a raw nginx vhost
# does not. The Vault console is the single highest-value TLS vhost in this topology to carry it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
