# RawProd — factory + platform, on the SAME EC2 as ALEMBIC (alembic-app), alongside its existing
# /etc/nginx/sites-enabled/alembic*.conf. This is additive: it does not touch alembic's server
# blocks and shares nothing with them except the box and certbot. Per MIGRATION_AWS_PLAN.md §2:
#
#   <factory>.huecycle.in  → static web/ + web-platform/ ; /rpc,/crypto,/v1,/auth → rawprod-api
#
# Hostnames below (rawfactory.huecycle.in, rawplatform.huecycle.in) are PLACEHOLDERS — the
# plan's own §5 H7 calls them "proposed", pending the actual DNS decision (no Route53 zone; DNS
# is cut over by a human, outside this lane). Replace both `server_name` values and the
# `ssl_certificate` paths certbot will write once the real hostnames are chosen; nothing else in
# this file changes.
#
# PORT: rawprod-api listens on 127.0.0.1:4100, not :3000 or :4000 — this box already has
# alembic-web on :3000 and alembic-api on :4000 (see alembic-api.socket / the drop-ins on
# alembic-web.service). :4100 is free. infra/aws/systemd/rawprod-api.env must set PORT=4100 to
# match.

upstream rawprod_api { server 127.0.0.1:4100; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_read_timeout 120s;

# ── factory (web/) ───────────────────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name rawfactory.huecycle.in;  # PLACEHOLDER — see header note

  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name rawfactory.huecycle.in;  # PLACEHOLDER — see header note

  ssl_certificate     /etc/letsencrypt/live/rawfactory.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rawfactory.huecycle.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_stapling on;
  ssl_stapling_verify on;

  include /etc/nginx/rawprod/security-headers-factory.conf;
  client_max_body_size 12m;
  root /srv/rawprod/app/web;

  # ── the BFF tunnel + direct API surface, all four prefixes the app actually uses ────────────
  # /rpc and /crypto/* are the BFF tunnel DEPLOY.md describes ("only these two ever appear in
  # the browser network tab"); /v1/* (backend/api/src/platform-ops/platform-ops.controller.ts)
  # and /auth/* (backend/cluster-org/src/auth/auth.controller.ts, backend/cluster-identity's)
  # are real, separately-routed controllers this codebase also serves today. A price/lookup is
  # never cached; a price is not a static asset (same rule as ALEMBIC's /api/ block).
  location /rpc {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }
  location /crypto/ {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }
  location /v1/ {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }
  location /auth/ {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }
  # backend/backend-kernel/src/health/health.controller.ts — used by infra/aws/deploy.sh's
  # health check and by anything else that wants a liveness probe without a browser origin.
  # S3 security review item 6: this location sets its own add_header (Cache-Control), which
  # means nginx does NOT inherit the server block's security headers here — every location
  # with an add_header of its own needs the explicit `include` too.
  location = /health {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}

# ── platform (web-platform/) ─────────────────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name rawplatform.huecycle.in;  # PLACEHOLDER — see header note

  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name rawplatform.huecycle.in;  # PLACEHOLDER — see header note

  ssl_certificate     /etc/letsencrypt/live/rawplatform.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rawplatform.huecycle.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_stapling on;
  ssl_stapling_verify on;

  include /etc/nginx/rawprod/security-headers-platform.conf;
  client_max_body_size 12m;
  root /srv/rawprod/app/web-platform;

  location /rpc {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-platform.conf;
  }
  location /crypto/ {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-platform.conf;
  }
  location /v1/ {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-platform.conf;
  }
  location /auth/ {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-platform.conf;
  }
  # S3 security review item 6: same missing-include fix as the factory server block above —
  # each of these three locations declares its own add_header, so each needs the explicit
  # include or it silently serves with NO security headers at all.
  location = /health {
    proxy_pass http://rawprod_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-platform.conf;
  }
  # index.html and sw.js must never be cached (web-platform/vercel.json's own rule) — a stale
  # service worker or shell is the one caching mistake that cannot self-heal from a reload.
  location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/rawprod/security-headers-platform.conf; try_files $uri =404; }
  location = /sw.js       { add_header Cache-Control "no-cache" always; include /etc/nginx/rawprod/security-headers-platform.conf; try_files $uri =404; }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
