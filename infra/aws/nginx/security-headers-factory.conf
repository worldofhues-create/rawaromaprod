# Translated EXACTLY from web/vercel.json's "headers" block (the factory/storefront portal).
# Included at server level AND inside any location that declares an add_header of its own — see
# /Users/apple/Downloads/alembic/ops/nginx/security-headers.conf's own note on why: nginx's
# add_header is inherited from an outer block ONLY IF the current block declares none of its own,
# so a location with its own Cache-Control silently drops every header below it unless this file
# is included there too.
#
# No CSP here — none in web/vercel.json today either. Not invented: adding one is a product
# decision about what the factory portal is allowed to load, not an ops-lane call.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# S3 security review item 7: Vercel's platform added this automatically; a raw nginx vhost
# does not. Every TLS vhost in this deployment gets it (see rawprod-main.conf's factory +
# platform server blocks and vault.conf's own security-headers-vault.conf).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
