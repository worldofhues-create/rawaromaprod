# The Vault EC2's nginx — its OWN box, per MIGRATION_AWS_PLAN.md §2 (separate EC2, separate SG,
# no public listener beyond the allow-list). server_name is a PLACEHOLDER
# (vault.huecycle.in — the plan's §5 H7 "proposed" name; DNS is a human cutover step, outside
# this lane) — replace it and the ssl_certificate paths certbot writes once the real hostname is
# chosen.
#
# PORT: vault-api listens on 127.0.0.1:4100 — same port number as rawprod-api on the main EC2,
# which is fine (different host, no conflict), and keeps both env files' PORT= identical.

upstream vault_api { server 127.0.0.1:4100; keepalive 8; }

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;

server {
  listen 80;
  listen [::]:80;
  server_name vault.huecycle.in;  # PLACEHOLDER — see header note

  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name vault.huecycle.in;  # PLACEHOLDER — see header note

  ssl_certificate     /etc/letsencrypt/live/vault.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vault.huecycle.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_stapling on;
  ssl_stapling_verify on;

  include /etc/nginx/rawprod/security-headers-vault.conf;
  client_max_body_size 12m;
  root /srv/rawprod/app/web-vault;

  # ── the allow-list, H5 ───────────────────────────────────────────────────────────────────
  # infra/aws/nginx/vault-allowlist.conf.placeholder explains why this is not filled in yet and
  # exactly what to put in vault-allowlist.conf once H5 (office IP/VPN) is answered. Until then
  # this `deny all;` keeps the console unreachable — the fail-closed default for the one host in
  # this topology whose entire security model is "reachable only via allow-list" (§109.3).
  # Replace this whole block with:
  #   include /etc/nginx/rawprod/vault-allowlist.conf;
  deny all;

  location /rpc {
    proxy_pass http://vault_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location /crypto/ {
    proxy_pass http://vault_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location /v1/ {
    proxy_pass http://vault_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location /auth/ {
    proxy_pass http://vault_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-vault.conf;
  }
  location = /health {
    proxy_pass http://vault_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}
