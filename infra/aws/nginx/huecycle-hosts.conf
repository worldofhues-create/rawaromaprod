# Lane HOSTS (2026-09-24): public huecycle.in names for Studio, RawProd consoles and the demo environment.
# Installed on the ALEMBIC app box (i-04e7dc4e5edcc1ff7) as /etc/nginx/sites-available/huecycle-hosts.conf,
# symlinked into sites-enabled. Loaded AFTER alembic.conf, rawaroma-demo-origin.conf and rawprod-cf-origin.conf and
# REUSES their http-level definitions (do not enable this file without them):
#   upstreams alembic_api(4000) alembic_web(3000)            <- alembic.conf (also its http-level proxy_set_header set)
#   upstreams alembic_demo_api(4010) alembic_demo_web(3010) rawprod_demo_api(4110), map $demo_connection
#                                                             <- rawaroma-demo-origin.conf
#   upstream rawprod_api_cf(4100), map $rawprod_cf_connection <- rawprod-cf-origin.conf
# TLS: one SAN cert `rawlanes.huecycle.in` issued with the SAME mechanism as raw/rawadmin/rawagent:
#   certbot certonly --nginx --cert-name rawlanes.huecycle.in -d <the 9 names>   (authenticator=nginx; certbot.timer renews)
# Vault: rawvault.huecycle.in has its OWN vhost, infra/aws/nginx/rawvault.conf (owner decision 2026-09-24);
# rawdemovault has none.
# console-config.js (OPS_GREEN §17, recorded from live 2026-09-25): every static RawProd console gets
# `window.ALEMBIC_CONSOLE_URL` injected ahead of its bundle by sub_filter, from
# /var/www/rawprod-config/{prod,demo}/console-config.js (repo: infra/aws/nginx/static-config/).
# Expected until deploy: rawprod-api (4100) and all demo services are down -> API paths / demo hosts answer 502.

# ── HTTP -> HTTPS for every name in this file ────────────────────────────────
server {
  listen 80; listen [::]:80;
  server_name rawstudio.huecycle.in rawfactory.huecycle.in rawplatform.huecycle.in
              rawdemo.huecycle.in rawdemoadmin.huecycle.in rawdemoagent.huecycle.in rawdemostudio.huecycle.in
              rawdemofactory.huecycle.in rawdemoplatform.huecycle.in;
  return 301 https://$host$request_uri;
}

# ═════════ ALEMBIC production: Content Studio (same shape as rawadmin, path /studio) ═════════
server {
  listen 443 ssl; listen [::]:443 ssl;
  server_name rawstudio.huecycle.in;
  ssl_certificate     /etc/letsencrypt/live/rawlanes.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rawlanes.huecycle.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  include /etc/nginx/alembic/security-headers-console.conf;
  client_max_body_size 12m;

  location = / { return 302 /studio; }
  location /api/ {
    proxy_pass http://alembic_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/alembic/security-headers-console.conf;
  }
  location /studio { proxy_pass http://alembic_web; }
  location /_next/ { proxy_pass http://alembic_web; include /etc/nginx/alembic/security-headers-console.conf; }
  # `logo/` (UX-D): ALEMBIC's brand mark and the RAW welcome's logo, beside its fonts and preloader.
  location ~ ^/(fonts/|logo/|rac-preload\.js$|manifest\.webmanifest$|sw\.js$|favicon|icon-|apple-touch-) {
    proxy_pass http://alembic_web;
    include /etc/nginx/alembic/security-headers-console.conf;
  }
  location / { return 404; }
}

# ═════════ RawProd production consoles (static + API proxy to rawprod-api :4100) ═════════
server {
  listen 443 ssl; listen [::]:443 ssl;
  server_name rawfactory.huecycle.in;
  ssl_certificate     /etc/letsencrypt/live/rawlanes.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rawlanes.huecycle.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  include /etc/nginx/rawprod/security-headers-factory.conf;
  client_max_body_size 12m;
  access_log /var/log/nginx/rawprod-hosts-access.log;
  error_log  /var/log/nginx/rawprod-hosts-error.log;

  location ~ ^/(rpc|crypto/|v1/|auth/|health$) {
    proxy_pass http://rawprod_api_cf;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $rawprod_cf_connection;
    proxy_read_timeout 120s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }
  root /var/www/rawprod-cf/factory;   # same deployed copy the 8443 origin serves for X-RawProd-Site: factory
  location ~ /\. { return 404; }
  location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/rawprod/security-headers-factory.conf; try_files /sw.js =404; }
  location = /console-config.js { root /var/www/rawprod-config/prod; try_files /console-config.js =404; }
  location / {
    sub_filter '<script src="/shell.js">' '<script src="/console-config.js"></script><script src="/shell.js">';
    sub_filter '<script src="/platform.js">' '<script src="/console-config.js"></script><script src="/platform.js">';
    sub_filter_once off;
    try_files $uri $uri/ $uri/index.html =404;
  }
}

