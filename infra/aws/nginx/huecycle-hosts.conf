# ═════════ ALEMBIC demo (4010/3010) — same host/path conventions as prod ═════════
server {
  listen 443 ssl; listen [::]:443 ssl;
  server_name rawdemo.huecycle.in;
  ssl_certificate     /etc/letsencrypt/live/rawlanes.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rawlanes.huecycle.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  include /etc/nginx/alembic/security-headers.conf;
  client_max_body_size 12m;
  access_log /var/log/nginx/alembic-demo-access.log;
  error_log  /var/log/nginx/alembic-demo-error.log;

  location /api/v1/payments/webhooks/ { proxy_pass http://alembic_demo_api; proxy_buffering off; }
  location /api/v1/webhooks/          { proxy_pass http://alembic_demo_api; proxy_buffering off; }
  location /api/ {
    proxy_pass http://alembic_demo_api;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/alembic/security-headers.conf;
  }
  location /admin { return 404; }
  location /agent { return 404; }
  location /_next/static/ {
    proxy_pass http://alembic_demo_web;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/alembic/security-headers.conf;
  }
  location / { proxy_pass http://alembic_demo_web; }
}

