# Installed LIVE 2026-09-26 as /etc/nginx/conf.d/huecycle-gzip.conf on the app box (i-04e7dc4e5edcc1ff7), after RC7.
# Compression for every huecycle host on the app box (http level; loaded from conf.d before sites-enabled).
# nginx.conf has `gzip on` with the default gzip_types (text/html only), so API JSON left uncompressed:
# the agent console's ~381 KB bootstrap missed its 8 s budget on a slow link (2026-09-25). The ALEMBIC repo's
# alembic-three-origin.conf carries the same four lines per /api/ location; the live hosts are served by
# huecycle-hosts.conf + alembic.conf, so it is set here once. gzip_proxied any: responses come from upstreams
# with Cache-Control: no-store, which nginx otherwise declines to compress for proxied requests.
# Upstream responses that are already encoded (Next.js static chunks) are passed through, never re-compressed.
gzip_types application/json text/plain text/css application/javascript text/javascript image/svg+xml;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
