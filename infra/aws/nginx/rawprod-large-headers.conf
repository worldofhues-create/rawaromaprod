# /etc/nginx/conf.d/rawprod-large-headers.conf -- http context, the app box (production AND demo share it).
#
# Recorded from live 2026-09-25 (stop-gap applied 17:10 UTC). The RawProd owner's access token carried all
# 257 permissions and was ~12.3 KB; nginx's default large_client_header_buffers is 4 8k, so the
# `Authorization: Bearer <token>` line no longer fit in one buffer and nginx answered 400/494 before the
# request reached the API -- the owner was locked out of Factory. 32k per buffer holds that header with room.
#
# The proper fix is a small token (permissions resolved server-side, RawProd lane token-rp). This stays anyway,
# as defence in depth: a token that grows again must not lock the owner out at the proxy.
#
# Installed by infra/aws/install-ops.sh app and infra/aws/demo/install-box.sh app; set NOWHERE else at http
# level (a second http-level large_client_header_buffers is a duplicate-directive error and nginx -t fails).
large_client_header_buffers 4 32k;
