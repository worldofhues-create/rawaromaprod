# Translated EXACTLY from web-platform/vercel.json's "headers" block. Same inheritance caveat as
# security-headers-factory.conf — include this at server level AND in any location that sets its
# own add_header.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# fullscreen=(self) (was fullscreen=()), owner requirement 2026-09-29: consoles open full screen ("focus
# mode", web-*/focus.js). `()` disables the Fullscreen API for the page itself, so focus mode could never
# start; `(self)` allows this origin only, still nothing framed (frame-ancestors 'none' + X-Frame-Options DENY).
# CSP needs no change: manifest-src and worker-src fall back to default-src 'self', which covers
# /manifest.webmanifest, its /icon-*.png and (Platform only) /sw.js.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self), interest-cohort=()" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# S3 security review item 7: Vercel's platform added this automatically; a raw nginx vhost
# does not. Every TLS vhost in this deployment gets it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
