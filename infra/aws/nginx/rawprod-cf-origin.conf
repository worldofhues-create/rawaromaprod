# RawProd CloudFront origin (owner ruling 2026-09-24: DNS is POST_LAUNCH, so the consoles go live on the
# distribution's own *.cloudfront.net name first). ENABLED on the ALEMBIC box, alongside alembic.conf.
#
#   viewer --TLS--> CloudFront (d*.cloudfront.net; huecycle.in aliases bind later) --TLS:8443--> this server
#
# Origin protection, both required:
#   1. port 8443 is reachable only from CloudFront: SG `rawprod-cf-origin` allows 8443 from the AWS-managed
#      prefix list com.amazonaws.global.cloudfront.origin-facing (pl-82a045eb) and nothing else.
#   2. every request must carry X-Origin-Verify = SSM /rawaroma/rawprod/cf-origin-secret, which CloudFront adds
#      as an origin custom header; the value lives in /etc/nginx/rawprod/cf-origin-secret.conf (mode 640,
#      rendered by infra/aws/cloudfront/render-origin-secret.sh), never in git.
# TLS to the origin reuses the raw.huecycle.in Let's Encrypt cert (the CloudFront origin domain is raw.huecycle.in,
# port 8443), so certbot's renew + reload covers this listener too.
# Self-contained: its own upstream/map names so it can coexist with rawprod-main.conf once that is enabled.

upstream rawprod_api_cf { server 127.0.0.1:4100; keepalive 8; }
map $http_upgrade $rawprod_cf_connection { default upgrade; '' ''; }
# OPS1 2026-09-24 interim front door: two API Gateway HTTP APIs (one execute-api hostname per console, each at its
# own root so the consoles' root-absolute paths, /manifest.webmanifest and the /sw.js scope all keep working).
# Each API's integration injects X-RawProd-Site; CloudFront (no header) keeps the placeholder root.
map $http_x_rawprod_site $rawprod_cf_root {
  default  /var/www/rawprod-cf;
  factory  /var/www/rawprod-cf/factory;
  platform /var/www/rawprod-cf/platform;
}

server {
  listen 8443 ssl http2 default_server;   # nginx 1.24 on this box: no standalone `http2 on;`
  server_name _;
  ssl_certificate     /etc/letsencrypt/live/raw.huecycle.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/raw.huecycle.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/rawprod/cf-origin-secret.conf;   # set $rawprod_cf_secret "<value>";
  if ($http_x_origin_verify != $rawprod_cf_secret) { return 403; }

  include /etc/nginx/rawprod/security-headers-factory.conf;
  client_max_body_size 12m;
  access_log /var/log/nginx/rawprod-cf-access.log;
  error_log  /var/log/nginx/rawprod-cf-error.log;

  # Static health page, served by nginx alone (no rawprod-api needed)
  location = /healthz { default_type text/plain; add_header Cache-Control "no-store" always; include /etc/nginx/rawprod/security-headers-factory.conf; return 200 "ok rawprod-cf-origin\n"; }

  # API paths: never cached (CloudFront uses CachingDisabled for these too)
  location ~ ^/(rpc|crypto/|v1/|auth/|health$) {
    proxy_pass http://rawprod_api_cf;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cloudfront_viewer_address;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Origin-Verify   "";
    proxy_set_header X-RawProd-Site    "";
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $rawprod_cf_connection;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/rawprod/security-headers-factory.conf;
  }

  # Console static files. Until the web build is deployed this is the placeholder in /var/www/rawprod-cf;
  # at deploy, point root at the built factory/platform output (one line).
  root $rawprod_cf_root;
  location ~ /\. { return 404; }
  location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/rawprod/security-headers-factory.conf; try_files /sw.js =404; }
  location / { try_files $uri $uri/ $uri/index.html =404; }
}
