# Local development stack — the reusable data plane every project starts with.
# Matches the tech-stack standard: Postgres 17 + PostGIS + pgvector, Redis 7, NATS 2.10 (JetStream).
# Usage: docker compose -f infra/docker-compose.dev.yml up -d
# Then point each @core/data-* package's DATABASE_URL at localhost:5433 and run migrate/seed.
name: core-dev

services:
  db:
    # PostGIS image bundles Postgres 17 + PostGIS 3.5. For pgvector, the migrations
    # do `CREATE EXTENSION IF NOT EXISTS vector` (image includes it on recent tags) or
    # swap to an image that ships pgvector. Postgres data is the only stateful piece.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432" # 5433 on host to avoid clashing with a local Postgres on 5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Reserved for the EXTRACTION stage (in the monolith the event bus is in-process).
  # Harmless to run locally if you want to exercise the broker-backed transport.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"] # JetStream + monitoring
    ports:
      - "4222:4222"
      - "8222:8222"
    profiles: ["broker"] # only starts with `--profile broker`

volumes:
  db_data:
  redis_data:
