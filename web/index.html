<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Factory · Raw Aroma Chem</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#EDEDEB">
  <!-- UX-D: the one icon set every ALEMBIC and RawProd surface uses (ALEMBIC release/ui/BRAND_ASSETS.md). -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <!-- Reference console design layer (rac-console.css, vendored verbatim from the owner reference)
       then the ALEMBIC visual contract (web/ui-contract/CONTRACT_HASH pins its version; do not
       hand-edit alembic-tokens.css — regenerate + re-vendor instead), then the Factory layer. -->
  <link rel="stylesheet" href="/ui-contract/fonts/outfit.css">
  <link rel="stylesheet" href="/ui-contract/fonts/jetbrains-mono.css">
  <link rel="stylesheet" href="/ui-contract/rac-console.css">
  <link rel="stylesheet" href="/ui-contract/alembic-tokens.css">
  <link rel="stylesheet" href="/ui-contract/shell.css">
  <link rel="stylesheet" href="/logo/brand.css">
</head>
<body>
  <!-- UX-D: the RAW welcome (ALEMBIC's public/rac-preload.js, byte-identical), first in <body> so
       it paints before shell.js runs; it lifts once #app has content. -->
  <script src="/rac-preload.js" data-mount="#app" data-logo="/logo/raw-logo@3x.png" data-fonts="/ui-contract/fonts/"></script>
  <div class="stage" id="root"><div id="app" class="app"></div></div>
  <script src="/qrcode.js"></script>
  <!-- Split from the former monolithic app.js (mechanical, no behaviour change) so parallel
       UI-parity lanes stop colliding. Plain classic scripts (no bundler): shell.js declares the
       shared globals (tunnel, ROLES, COLS, ACTIONS, primitives, router, boot); the ws-*.js files
       add workspace-specific view specials and MUST load after it. -->
  <script src="/shell.js"></script>
  <script src="/ws-supply.js"></script>
  <script src="/ws-mfg.js"></script>
  <script src="/ws-platform.js"></script>
  <!-- G4: in-app tutorial engine runner. Depends on globals from shell.js (tunnel/can/openSheet/
       raConfirm/toast/escHtml/$/st/session) — must load after it, but has no dependency on the
       ws-*.js workspace modules beyond the data-tutorial-target attributes they/shell.js carry. -->
  <script src="/tutorial.js"></script>
</body>
</html>
