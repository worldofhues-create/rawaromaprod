<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Factory · Raw Aromachem</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#EDEDEB">
  <!-- FAVICON-FLUKE: the Shell Fluke, white on a Kon Navy tile so it reads on a light and on a dark tab; the same nine files in Factory, Platform and Vault (tools/brand/favicon-fluke.py). -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <!-- Reference console design layer (rac-console.css, vendored verbatim from the owner reference)
       then the ALEMBIC visual contract (web/ui-contract/CONTRACT_HASH pins its version; do not
       hand-edit alembic-tokens.css — regenerate + re-vendor instead), then the Factory layer. -->
  <!-- FONT-RP-1: Manrope + JetBrains Mono, self-hosted; the only two faces. -->
  <link rel="preload" href="/ui-contract/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/ui-contract/fonts/type.css">
  <link rel="stylesheet" href="/ui-contract/rac-console.css">
  <link rel="stylesheet" href="/ui-contract/alembic-tokens.css">
  <link rel="stylesheet" href="/ui-contract/shell.css">
  <!-- UX-E: the Ask Aria panel (vanilla port of ALEMBIC's AriaPanel), vendored from ALEMBIC
       release/ui/aria/ — same DOM and classes as every other staff console. -->
  <link rel="stylesheet" href="/ui-contract/aria-panel.css">
  <link rel="stylesheet" href="/logo/brand.css">
</head>
<body>
  <!-- UX-D: the RAW welcome (ALEMBIC's public/rac-preload.js, byte-identical), first in <body> so
       it paints before shell.js runs; it lifts once #app has content. -->
  <script src="/rac-preload.js" data-mount="#app" data-logo="/logo/rac-lockup-shell-fluke-ink.png" data-fonts="/ui-contract/fonts/"></script>
  <div class="stage" id="root"><div id="app" class="app"></div></div>
  <script src="/qrcode.js"></script>
  <!-- Split from the former monolithic app.js (mechanical, no behaviour change) so parallel
       UI-parity lanes stop colliding. Plain classic scripts (no bundler): shell.js declares the
       shared globals (tunnel, ROLES, COLS, ACTIONS, primitives, router, boot); the ws-*.js files
       add workspace-specific view specials and MUST load after it. -->
  <!-- Click/notification/alert sounds (window.RaSound); before shell.js, which calls it. -->
  <script src="/sound.js"></script>
  <!-- Focus mode + "open as an app" (owner 2026-09-29): full screen on the first click, a menu switch,
       and an install offer. Before the console script, which mounts the menu switch. -->
  <script src="/focus.js" data-app="RAW Factory"></script>
  <!-- Quick-access dock model (web/dock.js, same copy in every console): before the console script. -->
  <script src="/dock.js"></script>
  <!-- Always-on Ruh (web/ruh.js, same copy in every console): badge, panel, urgent pop-up, RuhConfirm.
       Before the console script, which mounts the badge and routes guarded calls through it. -->
  <script src="/ruh.js"></script>
  <!-- Readable addresses (web/routes.js: #/<workspace>/<screen>[/<record>], older #/go/… links rewritten)
       and the plain words every screen uses (web/screen-guide.js). Pure data, before the console script. -->
  <script src="/routes.js"></script>
  <script src="/screen-guide.js"></script>
  <script src="/doc-format.js"></script>
  <script src="/shell.js"></script>
  <!-- IMPORT-RP: the bulk-import panel (same copy in the Vault console) and where the Factory mounts it. -->
  <script src="/import-panel.js"></script>
  <script src="/ws-imports.js"></script>
  <script src="/ws-supply.js"></script>
  <script src="/ws-mfg.js"></script>
  <script src="/ws-platform.js"></script>
  <!-- Lane produce (2026-09-29): Produce next, Put-away & pick, Rack layout, Shelf display, label
       printing and the live produce alerts. After the other ws-*.js (it adds to their ROLES/ACTIONS). -->
  <script src="/ws-produce.js"></script>
  <script src="/ws-setup.js"></script>
  <!-- Lane vaultsetup (2026-10-05): Formula setup — the two-owner "Let Ruh draft formulas" grant,
       formula shells per product, and the guarded product -> formula link. After ws-produce.js. -->
  <script src="/ws-formula-setup.js"></script>
  <!-- Lane pf-a (2026-11-05, PROD-A-7): floor queue, Pick / Verify / Mix kiosks, Scan a lot, Rules, Floor
       colours. weight.js is the one weight formatter (integer mg in, display text out). -->
  <script src="/weight.js"></script>
  <script src="/ws-floor.js"></script>
  <!-- PROD-B: production floor P2 (receiving audit, supplier payments, QC checkpoints, batch QC, lot hold
       and recall, raw-lot label). After ws-produce.js: it adds to ROLES like the other ws-*.js. -->
  <script src="/ws-floorb.js"></script>
  <!-- Lane pf-c (production floor P3/P4): weight display (lane A's web/weight.js, loaded once above), the one label
       template renderer, then Devices, Print queue, Maceration, Packing, Logistics, Couriers, Floor
       board and kiosk lock. After the other ws-*.js (it adds to their ROLES). -->
  <script src="/rac-code.js"></script>
  <script src="/label-render.js"></script>
  <script src="/shell-fluke.js"></script>
  <script src="/scan-input.js"></script>
  <!-- FLOOR-FIX-16: the kiosk reads a physical scale over Web Serial (Chrome, Edge). -->
  <script src="/scale-serial.js"></script>
  <script src="/ws-floor-ops.js"></script>
  <!-- Lane pf-d: Stock cover (order intelligence) and QC review (perfumer + vault approver decision).
       After the other ws-*.js (it adds to their ROLES, and a QC-review-only workspace for the two Vault roles). -->
  <script src="/ws-floord.js"></script>
  <!-- G4: in-app tutorial engine runner. Depends on globals from shell.js (tunnel/can/openSheet/
       raConfirm/toast/escHtml/$/st/session) — must load after it, but has no dependency on the
       ws-*.js workspace modules beyond the data-tutorial-target attributes they/shell.js carry. -->
  <script src="/tutorial.js"></script>
</body>
</html>
