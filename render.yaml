# RETIRED-for-production (PB-01, L-DEP). Production runs on AWS EC2 + systemd + nginx + RDS —
# see infra/aws/ and infra/aws/DEPLOY_AWS.md. Kept, not deleted, for branch preview deploys only
# (see DEPLOY.md's own RETIRED note for why).
#
# RAW AROMACHEM — Render blueprint (one free web service: API + in-process worker).
# Mirrors the proven local build. PORT is injected by Render. APP_ENV=prod makes the API refuse to
# boot unless CORS_ORIGINS is set (fail-closed), so CORS_ORIGINS is a required secret below.
services:
  - type: web
    name: raw-aroma-api
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /health
    # Workspace packages export src/*.ts (internal-packages pattern), so we run the API through the
    # swc ESM loader from source — identical to the proven local runtime — rather than a compiled
    # dist (which would resolve deps to .ts and crash). The worker runs in-process via main.ts.
    buildCommand: npm install -g pnpm@10.28.2 && pnpm install --frozen-lockfile --prod=false
    startCommand: node --import @swc-node/register/esm-register backend/api/src/main.ts
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: prod
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: JWT_ISSUER
        value: raw-aroma
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "2592000"
      - key: OUTBOX_POLL_MS
        value: "2000"
      - key: OUTBOX_BATCH
        value: "100"
      # ── secrets: set these in the Render dashboard (Environment), never commit them ──
      - key: DATABASE_URL   # Neon connection string (use the DIRECT endpoint, not -pooler)
        sync: false
      - key: JWT_SECRET     # ROTATE — generate fresh: openssl rand -base64 48
        sync: false
      - key: FORMULA_KEK    # ROTATE — generate fresh: openssl rand -base64 32
        sync: false
      - key: CORS_ORIGINS   # the exact Vercel origin(s), comma-separated, e.g. https://raw-aroma.vercel.app
        sync: false
